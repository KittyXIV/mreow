name: Publish

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

permissions:
  contents: write

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch Dalamud
        run: |
          curl -fsSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o "$RUNNER_TEMP/dalamud.zip"
          unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$RUNNER_TEMP/dalamud"
          echo "DALAMUD_HOME=$RUNNER_TEMP/dalamud" >> "$GITHUB_ENV"

      - name: Build, release and write repo.json
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES_TOKEN: ${{ secrets.PLUGIN_SOURCES_TOKEN }}
        run: python3 publish.py

      - name: Commit repo.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet || { git commit -m "repo.json updated"; git push; }
